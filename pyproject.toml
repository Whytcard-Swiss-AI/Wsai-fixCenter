[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsai_fckdot"
version = "1.0.0"
description = "Privacy-first MCP diagnostics and setup governance for agent tools, hooks, plugins, skills, accounts, instructions, configuration, and system state."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WSAI" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Whytcard-Swiss-AI/wsai_fckdot"
Issues = "https://github.com/Whytcard-Swiss-AI/wsai_fckdot/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "pytest-cov>=5", "ruff==0.16.3", "twine>=6"]

[project.scripts]
wsai_fckdot = "wsai_fckdot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wsai_fckdot/skills/wsai_fckdot-install" = ["skills/wsai_fckdot-install/SKILL.md"]
"share/wsai_fckdot/skills/wsai_fckdot-install/agents" = ["skills/wsai_fckdot-install/agents/openai.yaml"]
"share/wsai_fckdot/skills/wsai_fckdot-use" = ["skills/wsai_fckdot-use/SKILL.md"]
"share/wsai_fckdot/skills/wsai_fckdot-use/agents" = ["skills/wsai_fckdot-use/agents/openai.yaml"]
"share/wsai_fckdot/skills/wsai_fckdot-setup" = ["skills/wsai_fckdot-setup/SKILL.md"]
"share/wsai_fckdot/skills/wsai_fckdot-setup/agents" = ["skills/wsai_fckdot-setup/agents/openai.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wsai_fckdot --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["wsai_fckdot"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py310"
