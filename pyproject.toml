[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsai-fixcenter"
version = "0.1.0"
description = "Evidence-first MCP diagnostics for hooks, plugins, skills, and configuration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WSAI" }]
dependencies = []

[project.scripts]
fixcenter = "fixcenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

